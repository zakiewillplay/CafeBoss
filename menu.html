<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/CafeBoss/manifest.json">
    <title>Cafe Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        /* ========== YOUR ORIGINAL MENU STYLES (unchanged) ========== */
        :root { ... } /* full styles as before */
        /* Voice button listening state */
        .top-btn.listening { background: var(--amber); color: #fff; animation: micPulse 0.8s ease-in-out infinite; border-color: var(--amber); }
        @keyframes micPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,146,26,0.7); } 50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(232,146,26,0); } }
    </style>
</head>
<body>
    <!-- Ambient orbs, cloche, menu-content ... exactly the same as your original -->

    <div class="top-bar">
        <button class="top-btn" id="themeToggle">🌙 Dark</button>
        <select class="top-btn" id="langToggle">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
        </select>
        <button class="top-btn" id="shareBtn">📤 Share</button>
        <button class="top-btn" id="voiceOrderBtn" title="Order by voice">🎤</button>
    </div>

    <div id="busyBanner" style="display:none; background:#c0392b; color:#fff; text-align:center; padding:10px; position:fixed; top:0; left:0; right:0; z-index:100;">Heavy rush! Wait ~<span id="waitTimeDisplay"></span> mins</div>

    <!-- ... rest of the menu HTML ... -->

    <div class="cart-panel" id="cartPanel">
        <div class="cart-handle"></div>
        <div class="cart-inner">
            <div class="cart-header">
                <span class="cart-title">Your Order</span>
                <span class="cart-subtitle" id="cartCountLabel"></span>
            </div>
            <div id="cartItemsList"></div>
            <div class="cart-total-row">
                <span class="cart-total-label">Total</span>
                <span class="cart-total-val">₹<span id="cartTotal">0</span></span>
            </div>
            <input class="cart-input" id="tableNumber" placeholder="Table Number *">
            <input class="cart-input" id="customerName" placeholder="Your name (optional)">
            <input class="cart-input" id="customerPhone" placeholder="Your phone (for loyalty)" type="tel">
            <button class="btn-order" id="placeOrderBtn">Place Order →</button>
            <button class="btn-close-cart" id="closeCartBtn">Close</button>
        </div>
    </div>

    <!-- UPI overlay -->
    <div class="success-overlay" id="upiOverlay" style="display:none;">
        <div class="success-icon">💳</div>
        <div class="success-title">Pay via UPI</div>
        <p class="success-sub">Scan the QR code to pay ₹<span id="upiAmount"></span></p>
        <img id="upiQRImg" style="max-width:200px; background:#fff; padding:10px; border-radius:10px; margin:1rem 0;">
        <p class="success-sub">Order ID: <span id="upiOrderId"></span></p>
        <button class="btn-order" onclick="document.getElementById('upiOverlay').style.display='none'">Done</button>
    </div>

    <script>
        // ... all your original JS ...

        // Place order (updated with customer_phone)
        document.getElementById('placeOrderBtn').addEventListener('click', async () => {
            if (!cart.length) return showToast(tl('cartEmpty'));
            const table = document.getElementById('tableNumber').value.trim() || tableParam || '';
            if (!table) return showToast(tl('tableReq'));

            const orderItems = cart.map(c => ({ name: c.name, price: c.price, qty: c.qty }));
            const total = cart.reduce((s,c) => s + c.price*c.qty, 0);
            const phone = document.getElementById('customerPhone').value.trim();
            const { data: order, error } = await _sb.from('orders').insert({
                cafe_id: cafeId,
                customer_name: document.getElementById('customerName').value.trim() || 'Guest',
                table_number: table,
                items: orderItems,
                total: total,
                status: 'new',
                customer_phone: phone || null
            }).select().maybeSingle();

            if (error) { showToast('Order failed'); return; }

            cart = [];
            updateCartUI();
            document.getElementById('cartPanel').classList.remove('open');

            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('show');

            for (let i = 0; i < 16; i++) {
                const dot = document.createElement('div');
                dot.className = 'confetti-dot';
                const ang = (i / 16) * 360;
                const r   = 60 + Math.random() * 80;
                dot.style.setProperty('--fly', `translate(${Math.cos(ang*Math.PI/180)*r}px, ${Math.sin(ang*Math.PI/180)*r}px)`);
                dot.style.left = '50%'; dot.style.top = '40%';
                dot.style.background = ['#e8921a','#f5b445','#fff','#e74c3c'][i%4];
                dot.style.animationDelay = (Math.random()*0.3) + 's';
                overlay.appendChild(dot);
            }
            setTimeout(() => {
                overlay.classList.remove('show');
                overlay.querySelectorAll('.confetti-dot').forEach(d => d.remove());
            }, 3600);

            if (order && cafeData?.upi_id) {
                showUPIOption(order);   // show UPI QR immediately
            }
        });

        function showUPIOption(order) {
            if (!cafeData.upi_id) return;
            document.getElementById('upiOverlay').style.display = 'flex';
            document.getElementById('upiAmount').textContent = order.total;
            document.getElementById('upiOrderId').textContent = order.id;
            const upiUrl = `upi://pay?pa=${cafeData.upi_id}&pn=${cafeData.cafe_name}&am=${order.total}&tn=Order${order.id}`;
            document.getElementById('upiQRImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
        }

        // ... rest of V2 functions (voice, push, etc.) ...
    </script>
</body>
</html>
