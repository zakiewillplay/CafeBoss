<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/CafeBoss/manifest.json">
    <title>Cafe Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --gold: #ff7f50; 
            --gold-light: #ff9e7a;
            --dark: #0A0806;
            --glass: rgba(20, 18, 15, 0.85);
            --glass-border: rgba(255, 127, 80, 0.25);
            --card-bg: rgba(25, 22, 18, 0.95);
            --card-border: rgba(255, 127, 80, 0.2);
            --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.7), 0 5px 15px rgba(255, 127, 80, 0.15);
            --radius: 20px;
        }
        body.light-mode {
            --dark: #f4f1eb; 
            --glass: rgba(255, 255, 250, 0.95);
            --glass-border: rgba(255, 127, 80, 0.3);
            --card-bg: rgba(255, 255, 255, 1);
            --card-border: rgba(255, 127, 80, 0.25);
            --shadow-subtle: 0 8px 20px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(255, 127, 80, 0.15);
        }
        body:not(.light-mode) { --text-color: #f0e6d3; --muted: #a3957a; }
        body.light-mode { --text-color: #2a2416; --muted: #6b5e4a; }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--dark);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; letter-spacing: -0.3px; }

        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles span { position: absolute; display: block; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; opacity: 0; animation: floatUp linear infinite; will-change: transform, opacity; }
        @keyframes floatUp { 0% { transform: translateY(105vh) scale(0); opacity: 0; } 20% { opacity: 0.2; } 80% { opacity: 0.2; } 100% { transform: translateY(-5vh) scale(1.5); opacity: 0; } }

        .cloche-overlay { position: fixed; inset:0; z-index:1000; background:#0a0806; display: flex; align-items:center; justify-content:center; flex-direction:column; animation: clocheFadeOut 0.5s ease 1.5s forwards; pointer-events:none; }
        @keyframes clocheFadeOut { to { opacity:0; visibility:hidden; } }
        .cloche { width:150px; height:150px; border-radius:50% 50% 0 0; background: radial-gradient(circle at 30% 30%, #e0e0e0, #808080); position:relative; animation: liftCloche 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; box-shadow:0 8px 30px rgba(0,0,0,0.5); will-change: transform, opacity; }
        .cloche::after { content:''; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:24px; height:24px; border-radius:50%; background:#b0b0b0; }
        .plate { width:170px; height:16px; border-radius:50%; background:#e8e0d5; margin-top:-8px; }
        @keyframes liftCloche { 0% { transform:translateY(0); opacity:1; } 60% { transform:translateY(-150px); opacity:0.8; } 100% { transform:translateY(-300px); opacity:0; } }

        .menu-content { opacity:0; animation:revealMenu 0.6s ease 1.6s forwards; max-width: 860px; margin:0 auto; padding:1.5rem 1.5rem 100px; position: relative; z-index:1; }
        @keyframes revealMenu { to { opacity:1; } }

        .top-bar { display:flex; justify-content:flex-end; align-items:center; gap:0.8rem; padding:0.5rem 0; margin-bottom:1.5rem; }
        .top-bar button, .top-bar select {
            padding:0.5rem 1.2rem; border-radius: 40px; border: 1px solid var(--glass-border); background: var(--glass); 
            color: var(--text-color); cursor:pointer; font-size:0.85rem; font-weight:600; transition: transform 0.2s, border-color 0.2s; appearance: none; -webkit-appearance: none;
        }
        .top-bar button:hover, .top-bar select:hover { border-color: var(--gold); transform: translateY(-2px); }

        header.menu-header { text-align:center; padding:1.5rem 0; border-bottom: 1px solid var(--glass-border); margin-bottom:2rem; }
        header.menu-header h1 {
            font-size: clamp(2rem, 6vw, 3.5rem); font-weight:900;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, #d35400 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; line-height:1.2;
        }
        header.menu-header p { font-size: 1rem; color: var(--muted); max-width: 500px; margin:0 auto; }

        .search-container { position: sticky; top: 10px; z-index: 40; margin-bottom: 1.5rem; }
        .search-bar { width:100%; padding:1rem 1.5rem; border-radius: 40px; border: 1px solid var(--glass-border); background: var(--glass); backdrop-filter: blur(10px); color: var(--text-color); font-size:1.05rem; box-shadow: var(--shadow-subtle); transition: border-color 0.3s; }
        .search-bar:focus { outline:none; border-color: var(--gold); }

        .category-tabs { display:flex; gap:0.6rem; overflow-x:auto; padding:0.5rem 0; margin-bottom:2rem; scrollbar-width: none; position: sticky; top: 70px; z-index: 39; background: var(--dark); padding-top: 10px; transition: background 0.3s; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-tabs button { flex-shrink:0; padding:0.6rem 1.4rem; border-radius: 30px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color); cursor:pointer; font-weight:600; font-size:0.9rem; transition: all 0.2s ease; }
        .category-tabs button.active { background: var(--gold); color:#fff; border-color: var(--gold); transform: scale(1.05); }

        .category-section h3 { font-size: 1.8rem; font-weight:700; margin:2rem 0 1.2rem; color: var(--gold); padding-bottom: 0.5rem; border-bottom: 1px solid var(--glass-border); }

        .menu-item {
            display:flex; gap:1.5rem; align-items:center; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius); padding:1.5rem; margin-bottom:1.2rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: var(--shadow-subtle); will-change: transform; opacity: 0;
        }
        .menu-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--gold); }

        .menu-item-img { width: 110px; height: 110px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: #eee; }
        
        .item-details { flex: 1; min-width: 0; }
        .item-name { font-weight: 700; font-size: 1.25rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; flex-wrap: wrap; }
        .item-desc { font-size:0.9rem; color: var(--muted); margin-top:0.3rem; line-height:1.5; }
        
        .badge { padding:3px 8px; border-radius:6px; font-size:0.65rem; font-weight:700; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge-discount { background:#e74c3c; color:#fff; }
        .badge-featured { background:#f1c40f; color:#000; }
        .badge-new { background:#2ecc71; color:#fff; }

        .item-price { font-weight: 800; font-size: 1.4rem; color: var(--gold); margin-top:0.6rem; }

        .qty-controls { display:flex; align-items:center; gap:0.6rem; margin-left: auto; flex-shrink: 0; }
        .qty-controls button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color); cursor:pointer; font-size:1.2rem; font-weight:600; display:flex; align-items:center; justify-content:center; transition: 0.15s; }
        .qty-controls button:active { transform: scale(0.9); background: var(--gold); color:#fff; border-color: var(--gold); }
        .qty-num { font-weight: 700; font-size: 1.1rem; min-width: 24px; text-align: center; }

        .floating-cart, .waiter-btn { position:fixed; bottom:30px; width:65px; height:65px; border-radius:50%; font-size:1.6rem; border:none; cursor:pointer; z-index:49; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; transition: transform 0.2s; }
        .floating-cart { right:30px; background: var(--gold); color:#fff; }
        .waiter-btn { left:30px; background:#c0392b; color:#fff; z-index:48; }
        .floating-cart:hover, .waiter-btn:hover { transform: scale(1.08); }
        .floating-cart.pulse { animation: cartPulse 0.4s ease; }
        @keyframes cartPulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.2); } }
        
        .cart-badge { position:absolute; top:-5px; right:-5px; background:#e74c3c; color:#fff; width:24px; height:24px; border-radius:50%; font-size:0.8rem; display:none; align-items:center; justify-content:center; font-weight:700; border: 2px solid var(--dark); }

        .cart-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 30px 30px 0 0; padding: 2rem; transform: translateY(100%); visibility: hidden; opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1), opacity 0.4s ease; z-index: 50; max-height: 85vh; overflow-y: auto; box-shadow: 0 -20px 50px rgba(0,0,0,0.5); border-top: 1px solid var(--card-border); }
        .cart-panel.open { transform: translateY(0); visibility: visible; opacity: 1; }
        .cart-panel h3 { color:var(--gold); margin-bottom:1.5rem; font-size:1.8rem; }
        .cart-item-row { display:flex; justify-content:space-between; padding:0.8rem 0; border-bottom:1px solid var(--glass-border); font-size:0.95rem; }
        .cart-panel input { width:100%; padding:1rem; border-radius:14px; border:1px solid var(--glass-border); background:transparent; color:var(--text-color); margin-top:1rem; font-size:1rem; outline: none; }
        .cart-panel input:focus { border-color: var(--gold); }
        .cart-panel .place-order-btn { width:100%; padding:1.2rem; margin-top:1.5rem; border-radius:40px; background:var(--gold); color:#fff; border:none; font-weight:800; font-size:1.1rem; cursor:pointer; }
        .cart-panel .close-btn { width:100%; padding:0.8rem; margin-top:0.8rem; background:transparent; border:1px solid var(--glass-border); color:var(--text-color); border-radius:40px; cursor:pointer; font-weight: 600;}

        .success-overlay { position:fixed; inset:0; background:rgba(10, 8, 6, 0.95); z-index:60; display:flex; align-items:center; justify-content:center; flex-direction:column; opacity:0; pointer-events:none; transition:0.4s ease; }
        .success-overlay.show { opacity:1; pointer-events:auto; }
        
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: var(--card-bg); color: var(--text-color); padding: 12px 24px; border-radius: 30px; border: 1px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-weight: 600; font-size: 0.9rem; animation: slideDown 0.4s forwards, fadeOut 0.4s ease 2.5s forwards; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        /* ========================================= */
        /* BULLET-PROOF MOBILE LAYOUT (Side-By-Side) */
        /* ========================================= */
        @media (max-width: 768px) {
            .menu-item { 
                display: flex !important;
                flex-direction: row !important; 
                align-items: center !important;
                gap: 1rem !important; 
                padding: 1rem !important; 
                border-radius: 16px !important; 
            }
            .menu-item-img { 
                width: 85px !important; 
                height: 85px !important; 
                border-radius: 12px !important; 
                flex-shrink: 0 !important; 
            }
            .item-details { 
                flex: 1 !important;
                display: flex !important; 
                flex-direction: column !important; 
                justify-content: center !important; 
                min-width: 0 !important;
            }
            .item-name { font-size: 1.1rem !important; }
            .item-desc { font-size: 0.8rem !important; line-height: 1.4 !important; display: -webkit-box !important; -webkit-line-clamp: 2 !important; -webkit-box-orient: vertical !important; overflow: hidden !important; }
            .item-price { font-size: 1.2rem !important; margin-top: 0.3rem !important; }
            
            .qty-controls { 
                margin-left: auto !important; 
                flex-direction: column !important; 
                gap: 0.4rem !important; 
            }
            .qty-controls button { width: 32px !important; height: 32px !important; font-size: 1.1rem !important; }
            .qty-num { font-size: 1rem !important; min-width: 20px !important; }
            
            header.menu-header h1 { font-size: 2.2rem !important; }
            .floating-cart, .waiter-btn { width: 55px !important; height: 55px !important; font-size: 1.4rem !important; bottom: 20px !important; }
            .floating-cart { right: 20px !important; }
            .waiter-btn { left: 20px !important; }
            .search-container { top: 0 !important; }
            .category-tabs { top: 60px !important; }
        }
    </style>
</head>
<body class="light-mode">
    <div class="bg-particles" id="particles"></div>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="cloche-overlay">
        <div class="cloche"></div>
        <div class="plate"></div>
    </div>

    <div class="menu-content">
        <div class="top-bar">
            <button id="themeToggle">🌙 Dark</button>
            <select id="langToggle">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
            </select>
            <button id="shareBtn">📤 Share</button>
        </div>
        
        <div id="menuVisible">
            <header class="menu-header">
                <h1 id="cafeNameDisplay">Loading…</h1>
                <p id="cafeDesc"></p>
            </header>
            
            <div class="search-container">
                <input type="text" class="search-bar" id="searchBar" placeholder="Search menu…">
            </div>
            
            <div class="category-tabs" id="categoryTabs"></div>
            <div id="menuSections"></div>
        </div>
    </div>
    
    <button class="floating-cart" id="floatingCart">🛒<span class="cart-badge" id="cartBadge">0</span></button>
    <button class="waiter-btn" id="waiterBtn" title="Call Waiter">👋</button>
    
    <div class="cart-panel" id="cartPanel">
        <h3>Your Order</h3>
        <div id="cartItemsList"></div>
        <p style="font-weight:800; margin:1rem 0; font-size:1.2rem;">Total: ₹<span id="cartTotal">0</span></p>
        <input id="tableNumber" placeholder="Table Number *">
        <input id="customerName" placeholder="Your name (optional)">
        <button class="place-order-btn" id="placeOrderBtn">Place Order</button>
        <button class="close-btn" id="closeCartBtn">Close</button>
    </div>
    
    <div class="success-overlay" id="successOverlay">
        <div style="font-size:4rem; margin-bottom:1rem; animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">✅</div>
        <p id="successMsg" style="font-size:1.3rem; color:#fff; text-align:center; font-weight:600; line-height:1.5;">Order placed!<br>Waiting for confirmation...</p>
    </div>

    <style>@keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }</style>

    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const span = document.createElement('span');
            span.style.left = Math.random() * 100 + '%';
            span.style.animationDelay = Math.random() * 5 + 's';
            span.style.animationDuration = 5 + Math.random() * 8 + 's';
            particlesContainer.appendChild(span);
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const SUPABASE_URL = 'https://pbbybxdxnvzhjtkpfpej.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiYnlieGR4bnZ6aGp0a3BmcGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjQ0ODksImV4cCI6MjA5NDk0MDQ4OX0.u3VWUTu633pKfZ5Y8jpe2FUX4Gf9NGAKCsBGXqGTtao';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const cafeId = urlParams.get('id');
        const tableParam = urlParams.get('table');

        let lang = 'en';
        const t = { en: { search:'Search menu…', table:'Table Number *', name:'Your name (optional)', place:'Place Order', orderPlaced:'Order placed!', waiting:'Waiting for confirmation…', noItems:'No items found.', waiterCall:'Waiter called to your table!', cartEmpty:'Cart is empty', tableRequired:'Please enter your table number' }};
        function tl(key) { return t[lang]?.[key] || key; }

        document.getElementById('themeToggle').addEventListener('click', ()=>{
            document.body.classList.toggle('light-mode');
            document.getElementById('themeToggle').textContent = document.body.classList.contains('light-mode') ? '🌙 Dark' : '☀️ Light';
        });

        let cafeData = null, menuItems = [], cart = [], activeCategory = 'All';
        const savedCart = localStorage.getItem('cafe_cart');
        if (savedCart) cart = JSON.parse(savedCart);

        async function loadMenu() {
            if (!cafeId) return document.getElementById('cafeNameDisplay').textContent = 'Invalid Menu Link';
            
            const { data: cafe } = await _supabase.from('cafes').select('*').eq('id', cafeId).maybeSingle();
            if (cafe) {
                cafeData = cafe;
                document.getElementById('cafeNameDisplay').textContent = cafe.cafe_name;
                document.getElementById('cafeDesc').textContent = cafe.description || '';
            } else {
                document.getElementById('cafeNameDisplay').textContent = 'Srinagar Roastery';
            }

            const { data: items } = await _supabase.from('menu_items').select('*').eq('cafe_id', cafeId).eq('available', true).order('category');
            menuItems = items && items.length ? items : [];

            if (tableParam) {
                const tbl = document.getElementById('tableNumber');
                tbl.value = tableParam;
                tbl.readOnly = true; tbl.style.opacity = '0.7';
            }

            renderMenu(true);
            updateCartUI();
        }

        function renderMenu(initialLoad = false) {
            const search = document.getElementById('searchBar').value.toLowerCase();
            const filtered = menuItems.filter(i => {
                const nameMatch = (i.name || '').toLowerCase().includes(search);
                const descMatch = (i.description || '').toLowerCase().includes(search);
                return (nameMatch || descMatch) && (activeCategory==='All' || i.category===activeCategory);
            });

            const cats = ['All', ...new Set(menuItems.map(i=>i.category).filter(Boolean))].sort();
            document.getElementById('categoryTabs').innerHTML = cats.map(c =>
                `<button class="${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`
            ).join('');
            
            document.querySelectorAll('#categoryTabs button').forEach(b => b.addEventListener('click', function(){
                activeCategory = this.dataset.cat; renderMenu();
            }));

            let html = '';
            if (!filtered.length) {
                html = `<p style="text-align:center; padding:3rem; color:var(--muted); font-size:1.1rem;">${tl('noItems')}</p>`;
            } else {
                const catSet = activeCategory==='All' ? [...new Set(filtered.map(i=>i.category))].sort() : [activeCategory];
                catSet.forEach(cat => {
                    const catItems = filtered.filter(i=>i.category===cat);
                    if (!catItems.length) return;
                    html += `<div class="category-section"><h3>${cat}</h3>`;
                    catItems.forEach(item => {
                        let badges = '';
                        const tags = item.tags ? item.tags.split(',') : [];
                        if (tags.includes('featured')) badges += '<span class="badge badge-featured">🔥 Special</span> ';
                        if (tags.includes('new')) badges += '<span class="badge badge-new">🆕 New</span> ';
                        
                        // LOGIC UPDATE: Completely hide the image slot if no image is present
                        const imageHTML = (item.image_url && item.image_url.trim() !== '') 
                            ? `<img src="${item.image_url}" class="menu-item-img" loading="lazy">` 
                            : '';
                            
                        const cartItem = cart.find(c => c.id == item.id);
                        const qty = cartItem ? cartItem.qty : 0;

                        html += `
                        <div class="menu-item" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}">
                            ${imageHTML}
                            <div class="item-details">
                                <div class="item-name">${item.name}</div>
                                <div style="margin-bottom: 4px;">${badges}</div>
                                <div class="item-desc">${item.description || ''}</div>
                                <div class="item-price">₹<span class="active-price">${item.price}</span></div>
                            </div>
                            <div class="qty-controls">
                                <button class="qty-minus">−</button>
                                <span class="qty-num">${qty}</span>
                                <button class="qty-plus">+</button>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                });
            }
            
            document.getElementById('menuSections').innerHTML = html;
            attachEvents();

            if (initialLoad || search === '') {
                gsap.fromTo('.menu-item', { opacity:0, y:20 }, { opacity:1, y:0, stagger:0.04, duration:0.4, ease:"power2.out" });
            } else {
                document.querySelectorAll('.menu-item').forEach(el => { el.style.opacity = 1; el.style.transform = 'translateY(0)'; });
            }
        }

        let searchTimeout;
        document.getElementById('searchBar').addEventListener('input', () => {
            clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { renderMenu(false); }, 300);
        });

        function attachEvents() {
            document.querySelectorAll('.qty-minus').forEach(b => b.addEventListener('click', function(){
                const itemEl = this.closest('.menu-item');
                const id = itemEl.dataset.id;
                const existing = cart.find(c => c.id == id);
                if (existing) { existing.qty--; if (existing.qty <= 0) cart = cart.filter(c => c.id != id); }
                updateCartUI();
                itemEl.querySelector('.qty-num').textContent = cart.find(c => c.id == id)?.qty || 0;
            }));

            document.querySelectorAll('.qty-plus').forEach(b => b.addEventListener('click', function(){
                const itemEl = this.closest('.menu-item');
                const id = itemEl.dataset.id;
                const name = itemEl.dataset.name;
                const price = parseFloat(itemEl.dataset.price);

                const existing = cart.find(c => c.id == id);
                if (existing) existing.qty++; else cart.push({ id, name, price, qty: 1 });

                updateCartUI();
                itemEl.querySelector('.qty-num').textContent = existing ? existing.qty : 1;

                const floatBtn = document.getElementById('floatingCart');
                floatBtn.classList.remove('pulse'); void floatBtn.offsetWidth; floatBtn.classList.add('pulse');
            }));
        }

        function updateCartUI() {
            localStorage.setItem('cafe_cart', JSON.stringify(cart));
            const totalQty = cart.reduce((s,c)=>s+c.qty,0);
            const totalPrice = cart.reduce((s,c)=>s+c.price*c.qty,0);
            const badge = document.getElementById('cartBadge');
            badge.textContent = totalQty; badge.style.display = totalQty ? 'flex' : 'none';
            document.getElementById('cartTotal').textContent = totalPrice.toFixed(2);
            document.getElementById('cartItemsList').innerHTML = cart.map(c => `<div class="cart-item-row"><span>${c.name} x${c.qty}</span><span>₹${(c.price*c.qty).toFixed(2)}</span></div>`).join('');
        }

        document.getElementById('floatingCart').addEventListener('click', () => { 
            if(cart.length === 0) { showToast(tl('cartEmpty')); return; }
            document.getElementById('cartPanel').classList.add('open'); 
        });
        
        document.getElementById('waiterBtn').addEventListener('click', () => {
            const table = document.getElementById('tableNumber').value || tableParam;
            if (!table) { showToast(tl('tableRequired')); return; }
            showToast(tl('waiterCall'));
        });

        document.getElementById('closeCartBtn').addEventListener('click', ()=> document.getElementById('cartPanel').classList.remove('open'));

        document.getElementById('placeOrderBtn').addEventListener('click', () => {
            if (!cart.length) return showToast(tl('cartEmpty'));
            const table = document.getElementById('tableNumber').value.trim() || tableParam || '';
            if (!table) return showToast(tl('tableRequired'));
            
            cart = []; updateCartUI(); document.getElementById('cartPanel').classList.remove('open');
            const overlay = document.getElementById('successOverlay');
            document.getElementById('successMsg').innerHTML = `${tl('orderPlaced')}<br><span style="font-size:1rem; opacity:0.8;">${tl('waiting')}</span>`;
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 3500);
        });

        loadMenu();
    </script>
</body>
</html>
