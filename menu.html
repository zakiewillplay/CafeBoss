<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CafeBoss | Digital Menu & Order</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (same CSS as before – no changes needed) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f5f3ef; padding: 20px; max-width: 700px; margin: 0 auto; }
        .menu-app { background: white; border-radius: 32px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); overflow: hidden; padding: 24px 20px; }
        .cafe-header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #c2410c, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .cafe-header p { color: #5b4b3a; margin-top: 4px; border-left: 3px solid #f97316; padding-left: 12px; font-weight: 500; }
        .category-title { font-size: 1.4rem; font-weight: 700; margin: 24px 0 12px 0; padding-bottom: 6px; border-bottom: 2px solid #ffedd5; color: #2d3e2b; }
        .menu-grid { display: flex; flex-direction: column; gap: 12px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; background: #ffffff; border-radius: 20px; padding: 12px 16px; border: 1px solid #f0e6db; }
        .item-details { flex: 1; }
        .item-name { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .item-badge { background: #fef3c7; font-size: 0.7rem; padding: 2px 8px; border-radius: 30px; color: #b45309; font-weight: 500; }
        .item-desc { font-size: 0.8rem; color: #6b5a4e; margin-top: 4px; }
        .item-price { font-weight: 800; color: #2d6a4f; background: #ebf4e8; padding: 4px 12px; border-radius: 40px; font-size: 0.9rem; display: inline-block; }
        .add-btn { background: #f97316; border: none; color: white; font-weight: bold; padding: 8px 18px; border-radius: 40px; cursor: pointer; margin-left: 12px; font-size: 0.85rem; }
        .add-btn:active { transform: scale(0.96); background: #ea580c; }
        .cart-panel { background: #fffaf3; border-radius: 28px; padding: 18px; margin-top: 32px; border: 1px solid #ffe3c4; }
        .cart-title { font-weight: 700; margin-bottom: 12px; font-size: 1.2rem; }
        .cart-items-list { max-height: 200px; overflow-y: auto; }
        .cart-item-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #f0dbbe; }
        .cart-total { margin-top: 12px; text-align: right; font-weight: 800; font-size: 1.2rem; border-top: 2px solid #f9d9b3; padding-top: 12px; }
        .order-details { margin: 20px 0 16px; }
        .field-group { margin-bottom: 14px; }
        .field-group label { font-weight: 600; display: block; margin-bottom: 6px; }
        #tableNumber { width: 100%; padding: 12px; border-radius: 60px; border: 1px solid #ddd; font-size: 1rem; }
        textarea { width: 100%; border-radius: 24px; border: 1px solid #ddd; padding: 12px; resize: vertical; font-family: inherit; }
        .place-order-btn { background: #2d6a4f; width: 100%; border: none; padding: 14px; border-radius: 60px; font-weight: 800; font-size: 1rem; color: white; cursor: pointer; margin-top: 6px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 2000; }
        .review-card { background: white; width: 90%; max-width: 400px; border-radius: 40px; padding: 28px 24px; text-align: center; animation: fadeUp 0.25s ease; }
        .stars { display: flex; justify-content: center; gap: 12px; font-size: 2.4rem; margin: 16px 0; cursor: pointer; }
        .star { color: #ccc; }
        .star.selected { color: #fbbf24; }
        .review-input { width: 100%; border-radius: 28px; border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
        .review-submit { background: #f97316; width: 100%; border: none; padding: 12px; border-radius: 40px; font-weight: bold; color: white; margin-top: 8px; }
        .skip-review { background: none; border: none; margin-top: 14px; color: #888; text-decoration: underline; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .toast-msg { position: fixed; bottom: 30px; left: 20px; right: 20px; background: #2c2c2c; color: white; text-align: center; padding: 12px; border-radius: 60px; z-index: 2100; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .loading { text-align: center; padding: 30px; color: #f97316; }
        footer { font-size: 0.7rem; text-align: center; margin-top: 20px; color: #aaa; }
    </style>
</head>
<body>
<div class="menu-app">
    <div class="cafe-header">
        <h1>☕ Srinagar Roastery</h1>
        <p>Scan QR · Order · Enjoy</p>
    </div>
    <div id="menuContainer"><div class="loading">Loading fresh menu...</div></div>
    <div class="cart-panel">
        <div class="cart-title">🛒 Your Basket</div>
        <div id="cartItemsList" class="cart-items-list"><div style="color: #aa9e8e;">Cart is empty</div></div>
        <div class="cart-total">Total: ₹<span id="cartTotalAmount">0</span></div>
        <div class="order-details">
            <div class="field-group"><label>🍽️ Table number (any number)</label><input type="number" id="tableNumber" value="1" min="1" placeholder="e.g. 42 or 7"></div>
            <div class="field-group"><label>📝 Special instructions (optional)</label><textarea id="specialInstructions" rows="2" placeholder="No onion, extra sauce..."></textarea></div>
        </div>
        <button class="place-order-btn" id="placeOrderBtn">✅ Place order & review</button>
    </div>
</div>
<footer>CafeBoss · realtime orders · rate your meal</footer>

<div id="reviewModal" class="modal-overlay">
    <div class="review-card">
        <h2>🍽️ Rate your order</h2>
        <p>How was your experience?</p>
        <div class="stars" id="starSelector">
            <span class="star" data-val="1">★</span><span class="star" data-val="2">★</span><span class="star" data-val="3">★</span><span class="star" data-val="4">★</span><span class="star" data-val="5">★</span>
        </div>
        <textarea id="reviewCommentInput" class="review-input" placeholder="Tell us what you loved... (optional)"></textarea>
        <button id="submitReviewBtn" class="review-submit">Submit review</button>
        <button id="skipReviewBtn" class="skip-review">Maybe later</button>
    </div>
</div>
<div id="globalToast" class="toast-msg"></div>

<script>
    const SUPABASE_URL = 'https://pbbybxdxnvzhjtkpfpej.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiYnlieGR4bnZ6aGp0a3BmcGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjQ0ODksImV4cCI6MjA5NDk0MDQ4OX0.u3VWUTu633pKfZ5Y8jpe2FUX4Gf9NGAKCsBGXqGTtao';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cart = [];
    let currentOrderId = null;
    let selectedRating = 5;

    const menuContainer = document.getElementById('menuContainer');
    const cartItemsDiv = document.getElementById('cartItemsList');
    const cartTotalSpan = document.getElementById('cartTotalAmount');
    const tableInput = document.getElementById('tableNumber');
    const specialText = document.getElementById('specialInstructions');
    const placeBtn = document.getElementById('placeOrderBtn');
    const reviewModal = document.getElementById('reviewModal');
    const reviewComment = document.getElementById('reviewCommentInput');
    const submitReviewBtn = document.getElementById('submitReviewBtn');
    const skipReviewBtn = document.getElementById('skipReviewBtn');

    function showToast(msg, duration=2500) {
        const toast = document.getElementById('globalToast');
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', duration);
    }

    function renderCartUI() {
        if (!cartItemsDiv) return;
        if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<div style="color: #aa9e8e;">Cart is empty</div>';
            cartTotalSpan.innerText = '0';
            return;
        }
        let html = '', total = 0;
        cart.forEach(item => {
            total += item.price * item.quantity;
            html += `<div class="cart-item-row"><span><strong>${escapeHtml(item.name)}</strong> x${item.quantity}</span><span>₹${item.price * item.quantity}</span></div>`;
        });
        cartItemsDiv.innerHTML = html;
        cartTotalSpan.innerText = total;
    }

    function addToCart(item) {
        const existing = cart.find(i => i.id === item.id);
        if (existing) existing.quantity++;
        else cart.push({ ...item, quantity: 1 });
        renderCartUI();
        showToast(`✓ ${item.name} added`);
    }

    async function loadMenu() {
        try {
            const { data, error } = await supabase.from('menu_items').select('*').order('category', {ascending: true}).order('name');
            if (error) throw error;
            if (!data || data.length === 0) {
                menuContainer.innerHTML = '<div class="loading">📭 No menu items. Add some to "menu_items".</div>';
                return;
            }
            const categories = {};
            data.forEach(item => { const cat = item.category || 'Uncategorized'; if (!categories[cat]) categories[cat] = []; categories[cat].push(item); });
            let html = '';
            for (let [catName, items] of Object.entries(categories)) {
                html += `<div class="category-title">${escapeHtml(catName)}</div><div class="menu-grid">`;
                items.forEach(item => {
                    html += `<div class="menu-item" data-id="${item.id}" data-name="${escapeHtml(item.name)}" data-price="${item.price}">
                        <div class="item-details">
                            <div class="item-name">${escapeHtml(item.name)}${item.is_best ? '<span class="item-badge">🔥 Best of Cafe</span>' : ''}${item.is_chef_special ? '<span class="item-badge">👨‍🍳 Chef’s Special</span>' : ''}</div>
                            ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
                            <div class="item-price">₹${item.price}</div>
                        </div>
                        <button class="add-btn" data-id="${item.id}" data-name="${escapeHtml(item.name)}" data-price="${item.price}">Add</button>
                    </div>`;
                });
                html += `</div>`;
            }
            menuContainer.innerHTML = html;
            document.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', () => addToCart({ id: parseInt(btn.dataset.id), name: btn.dataset.name, price: parseInt(btn.dataset.price) }));
            });
        } catch(err) {
            console.error(err);
            menuContainer.innerHTML = '<div class="loading">⚠️ Failed to load menu. Check table "menu_items".</div>';
        }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    async function placeOrder() {
        if (cart.length === 0) { showToast('❌ Cart empty'); return; }
        let table = parseInt(tableInput.value);
        if (isNaN(table) || table < 1) { showToast('Valid table number needed'); return; }
        const instructions = specialText.value.trim();
        const orderItems = cart.map(i => ({ id: i.id, name: i.name, quantity: i.quantity, price: i.price }));
        const total = cart.reduce((s,i) => s + (i.price * i.quantity), 0);
        try {
            // Insert with UUID generation (let Supabase generate)
            const { data, error } = await supabase.from('orders').insert([{
                table_number: table,
                items: orderItems,
                total: total,
                special_instructions: instructions,
                status: 'pending',
                created_at: new Date().toISOString(),
                customer_reviewed: false
            }]).select();
            if (error) throw error;
            currentOrderId = data[0].id;   // this is a UUID string
            cart = [];
            renderCartUI();
            specialText.value = '';
            showToast(`✅ Order placed! Please rate your experience.`);
            reviewModal.style.display = 'flex';
        } catch(err) {
            console.error(err);
            showToast('Order failed. Ensure "orders" table exists with UUID id.');
        }
    }

    function initStars() {
        const stars = document.querySelectorAll('#starSelector .star');
        stars.forEach(s => s.addEventListener('click', () => {
            selectedRating = parseInt(s.dataset.val);
            stars.forEach(star => { if (parseInt(star.dataset.val) <= selectedRating) star.classList.add('selected'); else star.classList.remove('selected'); });
        }));
        stars.forEach(s => { if (parseInt(s.dataset.val) <= 5) s.classList.add('selected'); });
    }

    async function submitReview() {
        if (!currentOrderId) { reviewModal.style.display = 'none'; showToast('No order to review'); return; }
        const comment = reviewComment.value.trim();
        try {
            const { error } = await supabase.from('reviews').insert([{
                order_id: currentOrderId,
                rating: selectedRating,
                comment: comment || null,
                created_at: new Date().toISOString()
            }]);
            if (error) throw error;
            await supabase.from('orders').update({ customer_reviewed: true }).eq('id', currentOrderId);
            reviewModal.style.display = 'none';
            reviewComment.value = '';
            showToast('🙏 Thanks for your feedback!');
            currentOrderId = null;
        } catch(err) {
            console.error(err);
            showToast('Review not saved, but order confirmed.');
            reviewModal.style.display = 'none';
        }
    }

    placeBtn.addEventListener('click', placeOrder);
    submitReviewBtn.addEventListener('click', submitReview);
    skipReviewBtn.addEventListener('click', () => { reviewModal.style.display = 'none'; showToast('You can review later.'); });
    window.addEventListener('click', (e) => { if (e.target === reviewModal) reviewModal.style.display = 'none'; });

    loadMenu();
    initStars();
    renderCartUI();
</script>
</body>
</html>
